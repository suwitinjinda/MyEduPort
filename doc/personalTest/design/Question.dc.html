<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #eef2f7; color: #1f3461; }
    a { color: #059669; } a:hover { color: #047857; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 820px; padding: 28px; background: #eef2f7;">
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.04); padding: 28px 32px 24px;">

    <!-- Progress header -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
      <div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #059669; font-weight: 700;">Personal Character Test</div>
      <div style="font-size: 12.5px; color: #5b6b8a; font-weight: 600;">Question <span style="color:#1f3461; font-weight: 800;">12</span> of 50</div>
    </div>
    <div style="height: 8px; border-radius: 9999px; background: #f1f5f9; overflow: hidden; margin-bottom: 4px;">
      <div style="width: 24%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #1f3461, #10b981);"></div>
    </div>
    <div style="font-size: 11px; color: #9aa3b8; margin-bottom: 26px;">About 4 minutes left</div>

    <!-- The statement -->
    <div style="text-align: center; padding: 8px 0 28px;">
      <div style="font-size: 12px; color: #9aa3b8; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-bottom: 12px;">I see myself as someone who…</div>
      <div style="font-size: 27px; font-weight: 800; letter-spacing: -0.01em; color: #1f3461; line-height: 1.25; max-width: 26ch; margin: 0 auto;">…pays attention to details.</div>
    </div>

    <!-- Likert scale — 5 selectable pills -->
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 26px;">
      <button style="cursor: pointer; font-family: inherit; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px 8px; text-align: center;">
        <div style="width: 20px; height: 20px; border-radius: 9999px; border: 2px solid #cbd5e1; margin: 0 auto 10px;"></div>
        <div style="font-size: 12px; font-weight: 600; color: #5b6b8a; line-height: 1.3;">Very<br>Inaccurate</div>
      </button>
      <button style="cursor: pointer; font-family: inherit; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px 8px; text-align: center;">
        <div style="width: 20px; height: 20px; border-radius: 9999px; border: 2px solid #cbd5e1; margin: 0 auto 10px;"></div>
        <div style="font-size: 12px; font-weight: 600; color: #5b6b8a; line-height: 1.3;">Moderately<br>Inaccurate</div>
      </button>
      <button style="cursor: pointer; font-family: inherit; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px 8px; text-align: center;">
        <div style="width: 20px; height: 20px; border-radius: 9999px; border: 2px solid #cbd5e1; margin: 0 auto 10px;"></div>
        <div style="font-size: 12px; font-weight: 600; color: #5b6b8a; line-height: 1.3;">Neither /<br>Neutral</div>
      </button>
      <!-- selected state -->
      <button style="cursor: pointer; font-family: inherit; background: rgba(16,185,129,0.08); border: 1.5px solid #10b981; border-radius: 12px; padding: 16px 8px; text-align: center; box-shadow: 0 4px 6px -1px rgba(16,185,129,0.18);">
        <div style="width: 20px; height: 20px; border-radius: 9999px; border: 6px solid #10b981; margin: 0 auto 10px;"></div>
        <div style="font-size: 12px; font-weight: 700; color: #059669; line-height: 1.3;">Moderately<br>Accurate</div>
      </button>
      <button style="cursor: pointer; font-family: inherit; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px 8px; text-align: center;">
        <div style="width: 20px; height: 20px; border-radius: 9999px; border: 2px solid #cbd5e1; margin: 0 auto 10px;"></div>
        <div style="font-size: 12px; font-weight: 600; color: #5b6b8a; line-height: 1.3;">Very<br>Accurate</div>
      </button>
    </div>

    <!-- Navigation -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 18px; border-top: 1px solid #f1f5f9;">
      <button style="cursor: pointer; font-family: inherit; background: #ffffff; border: 1px solid #e2e8f0; color: #5b6b8a; font-size: 13.5px; font-weight: 600; padding: 10px 18px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
        Back
      </button>
      <div style="display: flex; gap: 5px;">
        <span style="width: 7px; height: 7px; border-radius: 9999px; background: #10b981;"></span>
        <span style="width: 7px; height: 7px; border-radius: 9999px; background: #cbd5e1;"></span>
        <span style="width: 7px; height: 7px; border-radius: 9999px; background: #cbd5e1;"></span>
      </div>
      <button style="cursor: pointer; font-family: inherit; background: linear-gradient(135deg, #1f3461 0%, #10b981 100%); border: none; color: #ffffff; font-size: 13.5px; font-weight: 700; padding: 10px 22px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px;">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
