# MyEduPort — nginx config for myeduport.ai
# Place at: /etc/nginx/sites-available/myeduport.ai
# Then: sudo ln -s /etc/nginx/sites-available/myeduport.ai /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name myeduport.ai www.myeduport.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myeduport.ai www.myeduport.ai;

    # SSL — commercial cert (DigiCert / Thawte) installed at /etc/ssl/myeduport.ai/
    # Renew before Feb 7 2027 by replacing these two files.
    ssl_certificate     /etc/ssl/myeduport.ai/fullchain.pem;
    ssl_certificate_key /etc/ssl/myeduport.ai/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/myeduport.access.log;
    error_log  /var/log/nginx/myeduport.error.log warn;

    # File upload size (transcripts, etc.)
    client_max_body_size 50M;

    # Serve frontend static files (built with `npm run build`)
    root /home/dev/MyEduPort/frontend/dist;
    index index.html;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve uploaded documents (transcripts, etc.) directly from backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-friendly timeouts for long Claude responses
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Health check (no auth) — useful for load balancers
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # SPA fallback — let React Router handle all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
